services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: wp2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wp2"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily pg_dump → ./backups/ on the host. Compressed, with rotation.
  # Uses the same postgres image so pg_dump's version matches the server.
  db-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: wp2
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      # 86400s = 24h. Drop to 3600 to test the loop in real time.
      INTERVAL_SECONDS: "86400"
    volumes:
      - ./backups:/backups
      - ./scripts/db_backup.sh:/usr/local/bin/db_backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/db_backup.sh"]
    restart: unless-stopped

  wa-sidecar:
    build:
      context: ./apps/wa-sidecar
    # Session creds persist across restarts via this named volume; no host
    # bind so the encrypted Baileys auth files don't leak into git.
    volumes:
      - wa_sessions:/data/sessions
    environment:
      PORT: "3001"
      SESSIONS_DIR: /data/sessions
      LOG_LEVEL: info
      # Webhook target + shared secret for pushing inbound messages back to api.
      API_URL: http://api:8000
      INTERNAL_TOKEN: dev-internal-secret-change-me
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./apps/backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa-sidecar:
        condition: service_started
    environment:
      WA_SIDECAR_URL: http://wa-sidecar:3001
      WA_SIDECAR_SECRET: dev-internal-secret-change-me
    ports:
      - "8001:8000"
    volumes:
      - ./apps/backend:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  worker:
    build:
      context: ./apps/backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    command: arq src.worker.WorkerSettings
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq src.worker' >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./apps/frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3010:3000"
    environment:
      # Browser-side: must be reachable from the user's machine, hence localhost.
      NEXT_PUBLIC_API_URL: http://localhost:8001
    volumes:
      - ./apps/frontend:/app
      # Anonymous volume preserves the in-image node_modules even though /app is bind-mounted.
      - /app/node_modules
      - /app/.next
    healthcheck:
      # localhost resolves to ::1 in this container; Next.js dev only binds IPv4 — use 127.0.0.1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  wa_sessions:
